name: Check for secrets

# Every push and pull request, docs included, since a token in a .md file is as public as any.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Look for secrets and private details
        run: python3 tools/check_secrets.py --all
