name: Build unsigned IPA

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    # Writes the sidestore release after a build of main.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on the simulator
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ids = [d['udid'] for runtime, items in sorted(devices.items(), reverse=True)
                 if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          print(ids[0])
          ")
          echo "Simulator: $SIM_ID"
          xcodebuild test \
            -project VibeLog.xcodeproj \
            -scheme VibeLog \
            -destination "id=$SIM_ID,arch=arm64" \
            -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO \
            | tail -n 60

      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project VibeLog.xcodeproj \
            -scheme VibeLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -n 60

      - name: Package IPA
        run: |
          APP=build/device/Build/Products/Release-iphoneos/VibeLog.app
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry VibeLog-unsigned.ipa Payload)

      - name: Check IPA contents
        run: |
          APP=dist/Payload/VibeLog.app
          ls -la "$APP" "$APP/Frameworks"
          plutil -p "$APP/Info.plist" | grep -E 'UIFileSharingEnabled|LSSupportsOpeningDocumentsInPlace|NSCameraUsageDescription|NSMicrophoneUsageDescription|MinimumOSVersion'
          lipo -info "$APP/VibeLog"
          test -f "$APP/Frameworks/VLProcessing.framework/default.metallib"
          for f in ObjCGuard VLCore VLCapture VLProcessing VLRecording; do
            test -f "$APP/Frameworks/$f.framework/$f"
          done
          ls -la dist/VibeLog-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VibeLog-unsigned-ipa
          path: dist/VibeLog-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      # SideStore on the phone adds the source once, then offers each build of main as an update.
      # The build number is the run number, which is how SideStore tells one build from the next.
      - name: Publish to the SideStore source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/sidestore"
          cp dist/VibeLog-unsigned.ipa dist/VibeLog.ipa
          python3 tools/sidestore_source.py dist/VibeLog.ipa \
            --download "$BASE/VibeLog.ipa" --source "$BASE/source.json" \
            --notes "Build ${{ github.run_number }}, $(git log -1 --format=%h): $(git log -1 --format=%s)" \
            > dist/source.json
          cat dist/source.json
          gh release view sidestore > /dev/null 2>&1 || gh release create sidestore --prerelease \
            --title "SideStore" --notes "The newest build of main for SideStore. Add $BASE/source.json as a source."
          gh release upload sidestore dist/VibeLog.ipa dist/source.json --clobber
