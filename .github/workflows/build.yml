name: Build unsigned IPA

# The app's code only: tools, docs and test plans run on this computer and don't change the app.
# The secret check runs on every push anyway. The SideStore tool and its icon still build.
on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tools/**'
      - 'tools/sidestore_source.py'
      - 'tools/sidestore/**'
      - '!.githooks/**'
      - '!.github/workflows/secrets.yml'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!tools/**'
      - 'tools/sidestore_source.py'
      - 'tools/sidestore/**'
  workflow_dispatch:

jobs:
  # The tests and the IPA build at once, on two Macs, so the IPA is ready in about three minutes
  # instead of nine. Publishing waits for both, so a build that fails its tests never reaches
  # SideStore.
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run unit tests on the simulator
        run: |
          set -o pipefail
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ids = [d['udid'] for runtime, items in sorted(devices.items(), reverse=True)
                 if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          print(ids[0])
          ")
          echo "Simulator: $SIM_ID"
          mkdir -p build
          xcodebuild test \
            -project VibeLog.xcodeproj \
            -scheme VibeLog \
            -destination "id=$SIM_ID,arch=arm64" \
            -derivedDataPath build/test \
            CODE_SIGNING_ALLOWED=NO \
            | tee build/test-output.txt | tail -n 60

      # Measurements tests print, and compile errors, which the 60 lines above cut off.
      - name: Show test measurements
        if: always()
        run: |
          grep -hE "LUT error|NaN sweep|NaN trace|[:] error[:]" build/test-output.txt | sort -u | head -40 || true


  ipa:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device, unsigned
        run: |
          set -o pipefail
          xcodebuild build \
            -project VibeLog.xcodeproj \
            -scheme VibeLog \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            MARKETING_VERSION=0.1.${{ github.run_number }} \
            | tail -n 60

      - name: Package IPA
        run: |
          APP=build/device/Build/Products/Release-iphoneos/VibeLog.app
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          (cd dist && zip -qry VibeLog-unsigned.ipa Payload)

      - name: Check IPA contents
        run: |
          APP=dist/Payload/VibeLog.app
          ls -la "$APP" "$APP/Frameworks"
          plutil -p "$APP/Info.plist" | grep -E 'UIFileSharingEnabled|LSSupportsOpeningDocumentsInPlace|NSCameraUsageDescription|NSMicrophoneUsageDescription|MinimumOSVersion'
          lipo -info "$APP/VibeLog"
          test -f "$APP/Frameworks/VLProcessing.framework/default.metallib"
          for f in ObjCGuard VLCore VLCapture VLProcessing VLRecording; do
            test -f "$APP/Frameworks/$f.framework/$f"
          done
          ls -la dist/VibeLog-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: VibeLog-unsigned-ipa
          path: dist/VibeLog-unsigned.ipa
          if-no-files-found: error
          retention-days: 30


  publish:
    needs: [test, ipa]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Writes the sidestore release and branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VibeLog-unsigned-ipa
          path: dist
      # SideStore on the phone adds the source once, then offers each build of main as an update.
      # The run number is the build number and the version's last part. SideStore only offered an
      # update once the version itself changed; with 0.1.0 on every build it showed none.
      - name: Publish to the SideStore source
        env:
          GH_TOKEN: ${{ github.token }}
        # SideStore gives a source about 3 s, which a release download's redirect can miss, so the
        # source is served from the sidestore-source branch through raw.githubusercontent.com.
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/sidestore"
          SOURCE="https://raw.githubusercontent.com/${{ github.repository }}/sidestore-source/source.json"
          cp dist/VibeLog-unsigned.ipa dist/VibeLog.ipa
          python3 tools/sidestore_source.py dist/VibeLog.ipa \
            --download "$BASE/VibeLog.ipa" --source "$SOURCE" \
            --notes "Build ${{ github.run_number }}, $(git log -1 --format=%h): $(git log -1 --format=%s). Source, GPLv3: https://github.com/${{ github.repository }}/tree/${{ github.sha }}" \
            > dist/source.json
          cat dist/source.json
          gh release view sidestore > /dev/null 2>&1 || gh release create sidestore --prerelease \
            --title "SideStore" --notes "The newest build of main for SideStore. Add $SOURCE as a source. Each build's source, under GPLv3, is the commit its notes name."
          gh release upload sidestore dist/VibeLog.ipa dist/source.json --clobber
          # One commit holding only the source, replaced on each build.
          mkdir source && cp dist/source.json source/
          cd source
          git init -q -b sidestore-source
          git add source.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" sidestore-source
